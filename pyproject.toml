[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fault-prediction-platform"
version = "0.1.0"
description = "Component-based fault prediction graph designer and execution runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.1,<3", "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2", "pydantic>=2.7,<3", "lxml>=5,<7",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1"
]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
xgboost = ["xgboost>=2.1,<4"]
parquet = ["pyarrow>=15,<22"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pytest-asyncio>=0.24,<2"]

[project.scripts]
fault-platform = "fault_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fault_platform = ["xml_io/*.xsd", "web/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
